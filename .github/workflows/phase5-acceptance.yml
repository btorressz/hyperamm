name: Phase 5 Acceptance

on:
  push:
    branches:
      - chatgpt/phase-5-inventory-skew
  pull_request:
    branches:
      - main

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run backend suite
        working-directory: backend
        run: pytest

      - name: Verify FastAPI startup and health
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/hyperamm-uvicorn.log 2>&1 &
          pid=$!
          trap 'kill $pid || true; cat /tmp/hyperamm-uvicorn.log' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/hyperamm-uvicorn.log
          exit 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Static diff validation
        run: git diff --check origin/main...HEAD
