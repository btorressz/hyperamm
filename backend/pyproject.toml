[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperamm"
version = "0.4.0"
description = "Adaptive virtual AMM and CLOB market-making engine for Hyperliquid"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
  "numpy>=2.1,<3",
  "hyperliquid-python-sdk>=0.24.0,<0.25",
  "eth-account>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where=["."]
include=["app*"]

[tool.pytest.ini_options]
asyncio_mode="auto"
pythonpath=["."]
